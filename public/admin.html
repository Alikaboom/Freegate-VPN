<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Freegate VPN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <h1>Freegate VPN</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="plans.html">Products</a></li>
                    <li><a href="history.html">Order History</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 4rem 0; max-width: 600px;">
        <h2 style="margin-bottom: 2rem; color: #2c3e50;">Add New VPN Plan</h2>
        
        <div class="product-card" style="text-align: left;">
            <form id="add-product-form" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Plan Name</label>
                    <input type="text" id="name" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Description</label>
                    <textarea id="desc" required rows="3" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>
                
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Price ($)</label>
                    <input type="number" id="price" required min="1" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Tier Level (e.g. Basic, Pro)</label>
                    <input type="text" id="tier" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Bandwidth/Format Limit</label>
                    <input type="text" id="bandwidth" required placeholder="e.g. Raw VLESS only" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <button type="submit" class="btn" style="margin-top: 1rem;">Save Product</button>
            </form>
            <p id="status-msg" style="margin-top: 1rem; font-weight: bold;"></p>
        </div>
        <h2 style="margin-top: 3rem; margin-bottom: 2rem; color: #2c3e50; border-top: 2px solid #eee; padding-top: 2rem;">Database Console</h2>
        <div class="product-card" style="text-align: left;">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Collection</label>
                    <input type="text" id="db-col" value="orders" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Method</label>
                    <select id="db-method" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="find">find</option>
                        <option value="deleteMany">deleteMany</option>
                        <option value="count">countDocuments</option>
                        <option value="drop">drop</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: bold; margin-bottom: 0.5rem; display: block;">Query Filter (JSON)</label>
                    <textarea id="db-filter" rows="3" placeholder='{"status": "completed"}' style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: monospace;"></textarea>
                </div>
                <button type="button" id="run-db-btn" class="btn" style="background-color: #c0392b;">Execute Query</button>
            </div>
            <pre id="db-output" style="margin-top: 1rem; padding: 1rem; background: #2c3e50; color: #ecf0f1; border-radius: 4px; overflow-x: auto; max-height: 300px;">Ready...</pre>
        </div>
    </main>
    <script>
        document.getElementById('run-db-btn').addEventListener('click', async () => {
            const out = document.getElementById('db-output');
            out.textContent = 'Executing...';
            try {
                const filterText = document.getElementById('db-filter').value;
                if (filterText.trim()) JSON.parse(filterText);
                
                const res = await fetch('/api/admin/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        collection: document.getElementById('db-col').value,
                        method: document.getElementById('db-method').value,
                        filter: filterText
                    })
                });
                const data = await res.json();
                out.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                out.textContent = 'Error: ' + err.message;
            }
        });
        
        const pin = prompt("Enter Admin PIN to access this page:");
        if (pin !== "1234") {
            alert("Unauthorized access.");
            window.location.href = "index.html";
        }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.color = '#333';
            statusMsg.textContent = 'Saving...';

            const newProduct = {
                name: document.getElementById('name').value,
                description: document.getElementById('desc').value,
                price: parseFloat(document.getElementById('price').value),
                tier: document.getElementById('tier').value,
                bandwidthLimit: document.getElementById('bandwidth').value
            };

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                if (response.ok) {
                    statusMsg.style.color = '#27ae60';
                    statusMsg.textContent = 'Product added successfully!';
                    document.getElementById('add-product-form').reset();
                } else {
                    throw new Error('Failed to save');
                }
            } catch (err) {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'Error saving product.';
            }
        });
    </script>
</body>
</html>
