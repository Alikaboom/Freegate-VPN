<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Details - Freegate VPN</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load PayPal Sandbox SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=ARMFC2UC_679X8VGp75J5bzs5MKvfjbvP-Xd9dkFjBsEapF2jeWLi2Sw84nz1JFWaRvKTlU192n1_PZa&currency=USD"></script>
</head>
<body>
    <header>
        <div class="container header-container">
            <h1>Freegate VPN</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="plans.html">Products</a></li>
                    <li><a href="history.html">Order History</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 4rem 0;">
        <div id="product-details" class="product-card" style="max-width: 600px; margin: 0 auto;">
            <p class="loading-text">Loading plan details...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const detailsContainer = document.getElementById('product-details');

            if (!productId) {
                detailsContainer.innerHTML = '<p class="error">No product ID provided.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/products/${productId}`);
                if (!response.ok) throw new Error('Product not found');
                
                const product = await response.json();

                detailsContainer.innerHTML = `
                    <h2>${product.name}</h2>
                    <div class="price">$${product.price}</div>
                    <p>${product.description}</p>
                    <div style="background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 2rem 0; border: 1px solid #eee;">
                        <h4 style="margin-bottom: 0.5rem; color: #2c3e50;">Package Inclusions</h4>
                        <ul style="padding-left: 1.5rem; color: #555; line-height: 1.6;">
                            <li><strong>Focus:</strong> ${product.tier}</li>
                            <li><strong>Formats Unlocked:</strong> ${product.bandwidthLimit}</li>
                        </ul>
                    </div>
                    <div id="paypal-button-container" style="margin-top: 2rem;"></div>
                    <div id="payment-success" style="display: none; color: #27ae60; font-weight: bold; margin-top: 1rem;"></div>
                    <div id="payment-error" style="display: none; color: #e74c3c; font-weight: bold; margin-top: 1rem; padding: 1rem; border: 1px solid #e74c3c; border-radius: 4px; background: #fdf2f0;">
                        Transaction failed or was cancelled. Please try again.
                    </div>
                `;

                paypal.Buttons({
                    createOrder: async (data, actions) => {
                        const res = await fetch('/api/payments/create-paypal-order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ productId: product._id })
                        });
                        const orderData = await res.json();
                        
                        return actions.order.create({
                            purchase_units: [{
                                amount: {
                                    value: parseFloat(product.price).toFixed(2)
                                }
                            }]
                        });
                    },
                    onApprove: async (data, actions) => {
                        const details = await actions.order.capture();
                        
                        const res = await fetch('/api/payments/capture-paypal-order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                orderID: details.id,
                                productId: product._id
                            })
                        });
                        const captureResult = await res.json();

                        if (captureResult.status === 'COMPLETED') {
                            document.getElementById('paypal-button-container').style.display = 'none';
                            
                            const successDiv = document.getElementById('payment-success');
                            successDiv.style.display = 'block';
                            successDiv.innerHTML = `
                                Payment Successful! Your VPN has been provisioned.<br><br>
                                <strong style="color: #333;">Your Subscription URL:</strong><br>
                                <code style="display: block; padding: 10px; background: #f4f4f4; border: 1px solid #ddd; margin-top: 10px; word-break: break-all; color: #2c3e50;">
                                    ${captureResult.configUrl}
                                </code>
                                <br><small>Redirecting to your Order History...</small>
                            `;
                            
                            setTimeout(() => {
                                window.location.href = 'history.html';
                            }, 6000);
                        }
                    },
                    onCancel: function (data) {
                        document.getElementById('payment-error').style.display = 'block';
                        document.getElementById('payment-error').innerText = 'Transaction was cancelled by the user. Please try again.';
                        document.getElementById('payment-success').style.display = 'none';
                    },
                    onError: function (err) {
                        document.getElementById('payment-error').style.display = 'block';
                        document.getElementById('payment-error').innerText = 'A network or processing error occurred. Please try checking out again.';
                        document.getElementById('payment-success').style.display = 'none';
                    }
                }).render('#paypal-button-container');

            } catch (err) {
                detailsContainer.innerHTML = '<p class="error">Failed to load product details.</p>';
            }
        });
    </script>
</body>
</html>
