<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Plans - Freegate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <h1>Freegate VPN</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="plans.html">Products</a></li>
                    <li><a href="history.html">Order History</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="products-section" class="container" style="padding: 4rem 0;">
            <h2 style="text-align: center; color: #2c3e50; margin-bottom: 1rem;">Choose Your BPB-Panel Tier</h2>
            <p style="text-align: center; color: #7f8c8d; margin-bottom: 2rem;">Unlock advanced formats and fragmentation settings as you upgrade.</p>
            
            <div class="search-container" style="text-align: center; margin-bottom: 3rem;">
                <input type="text" id="search-input" placeholder="Search plans (e.g. Basic, Pro)..." style="padding: 0.75rem; width: 100%; max-width: 400px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 1rem; padding-left: 1.5rem; transition: border-color 0.3s;">
            </div>

            <div class="product-grid" id="product-list">
                <p class="loading-text">Loading secure tiers...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Freegate VPN - Final Project B204.</p>
        </div>
    </footer>

    <script>
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const productList = document.getElementById('product-list');
            const searchInput = document.getElementById('search-input');
            
            try {
                const response = await fetch('/api/products?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to fetch products');
                
                allProducts = await response.json();
                renderProducts(allProducts);

                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = allProducts.filter(p => 
                        p.name.toLowerCase().includes(term) || 
                        p.description.toLowerCase().includes(term) ||
                        p.tier.toLowerCase().includes(term)
                    );
                    renderProducts(filtered);
                });

            } catch (err) {
                productList.innerHTML = '<p class="error">Error loading products. Please try again.</p>';
            }

            function renderProducts(products) {
                if (products.length === 0) {
                    productList.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No plans match your search.</p>';
                    return;
                }

                productList.innerHTML = ''; 

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    card.style.justifyContent = 'space-between';
                    
                    let featureDetails = '';
                    if (product.name === 'Starter') {
                        featureDetails = '<li>Includes Raw `vless://` strings</li><li>Manual entry required</li><li>Best for basic legacy clients</li>';
                    } else if (product.name === 'Standard') {
                        featureDetails = '<li>Everything in Starter</li><li><strong>Base64 Subscription:</strong> Auto-updates your node list dynamically in v2rayNG/Nekobox without manual pasting.</li>';
                    } else if (product.name === 'Advanced') {
                        featureDetails = '<li>Everything in Standard</li><li><strong>Sing-box JSON:</strong> Grants access to TLS Fragmentation (len: 10-20) to mask your handshake from SNI DPI firewalls.</li>';
                    } else if (product.name === 'Complete') {
                        featureDetails = '<li>Everything in Advanced</li><li><strong>Clash Meta YAML:</strong> Automated load balancing across Clean IPs, built-in ad-blocking rulesets, and intelligent routing.</li>';
                    }

                    card.innerHTML = `
                        <div>
                            <h4 style="font-size: 1.5rem; color: #2c3e50; margin-bottom: 0.5rem;">${product.name}</h4>
                            <div style="font-size: 0.9rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem;">${product.tier}</div>
                            
                            <div class="price" style="font-size: 2.5rem; font-weight: bold; color: #27ae60; margin-bottom: 1.5rem;">$${product.price}</div>
                            
                            <p style="margin-bottom: 1.5rem; color: #34495e; line-height: 1.5;">${product.description}</p>
                            
                            <!-- Interactive Expansion -->
                            <details style="text-align: left; background: #f8f9fa; padding: 1rem; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 1.5rem; cursor: pointer;">
                                <summary style="font-weight: bold; color: #2980b9; outline: none;">View Format Specs</summary>
                                <ul style="margin-top: 1rem; padding-left: 1.5rem; font-size: 0.9rem; color: #555; line-height: 1.6;">
                                    ${featureDetails}
                                </ul>
                            </details>
                        </div>
                        
                        <button class="btn btn-buy" style="width: 100%; margin-top: auto;" onclick="window.location.href='product.html?id=${product._id}'">Select ${product.name}</button>
                    `;
                    productList.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
